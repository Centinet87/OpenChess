name: CI

on:
  push:
    branches:
      - main
      - desa
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Base de `affected`: la rama destino en un PR, o la misma rama en un push
      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: ${{ github.base_ref || github.ref_name }}

      - run: npx nx format:check
      - run: npx nx affected -t lint typecheck test build
