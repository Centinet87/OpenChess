name: CI

# Solo manual (pestaña Actions → Run workflow). El chequeo de cada push corre
# en local con el hook pre-push (`npm run check`).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Base de `affected`: la rama destino en un PR, o la misma rama en un push
      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: ${{ github.base_ref || github.ref_name }}

      - run: npx nx format:check
      - run: npx nx affected -t lint typecheck test build
